# Production stack for archonarena.com
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Topology: Caddy terminates TLS (automatic Let's Encrypt) and reverse-proxies
# everything to the lobby, except /node-*/socket.io paths which go to the game
# nodes. Game nodes advertise no address, so browsers connect to them on the
# site origin — no extra DNS records or open ports per node.
#
# See docs/DEPLOYMENT.md for the full runbook (DNS, first boot, backups).

services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        environment:
            - DOMAIN=${DOMAIN:-archonarena.com}
        depends_on:
            - lobby

    lobby:
        build: .
        image: archonarena
        restart: unless-stopped
        expose:
            - '4000'
        # Runtime-written images must outlive container recreation: card art
        # is downloaded by fetchdata, avatars/backgrounds are user uploads.
        # Without these volumes every redeploy silently wipes them.
        volumes:
            - card_images:/usr/src/app/public/img/cards
            - user_avatars:/usr/src/app/public/img/avatar
            - user_backgrounds:/usr/src/app/public/img/bgs
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        environment:
            - NODE_ENV=production
            - NODE_CONFIG_ENV=production
            - PORT=4000
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=${DB_USER:?set in .env.production}
            - DB_PASSWORD=${DB_PASSWORD:?set in .env.production}
            - DB_NAME=${DB_NAME:-archonarena}
            - REDIS_URL=redis://redis:6379
            - SECRET=${SECRET:?set in .env.production}
            - HMAC_SECRET=${HMAC_SECRET:?set in .env.production}
            - DOMAIN=${DOMAIN:-archonarena.com}
            - VERSION=${VERSION:-}
            - SENTRY_DSN=${SENTRY_DSN:-}
            - CAPTCHA_KEY=${CAPTCHA_KEY:-}
            - DOK_API_KEY=${DOK_API_KEY:-}
            # ARCHON: transactional email. These were documented in
            # .env.production.example but never forwarded here, so nothing set on
            # the server reached the app. That was invisible rather than loud:
            # config/production.json5 hardcodes emailFromAddress, so the "email
            # not configured" guards all saw a sender and stayed quiet, while
            # every send failed for want of a region and credentials. With
            # verification required that means no account can be registered at
            # all. Run `npm run check:email` after any change here.
            - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}
            - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
            - AWS_SES_REGION=${AWS_SES_REGION:-}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
            # Absolute links in email raised by background jobs, which have no
            # request to derive an origin from.
            - SITE_URL=${SITE_URL:-}
            - CSP_MODE=${CSP_MODE:-}
            # Escape hatch: set false to run without email, accepting that
            # unverified addresses can play. Anything else leaves it on.
            - REQUIRE_ACTIVATION=${REQUIRE_ACTIVATION:-}
            - OIDC_ENABLED=${OIDC_ENABLED:-}
            - OIDC_ISSUER=${OIDC_ISSUER:-}
            - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
            - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
            - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
        command: ['node', '.']

    node-0:
        image: archonarena
        restart: unless-stopped
        expose:
            - '9500'
        depends_on:
            - redis
            - lobby
        environment:
            - NODE_ENV=production
            - NODE_CONFIG_ENV=production
            - SERVER=node-0
            - PORT=9500
            - REDIS_URL=redis://redis:6379
            - SECRET=${SECRET:?set in .env.production}
            - VERSION=${VERSION:-}
            - SENTRY_DSN=${SENTRY_DSN:-}
        command: ['node', 'server/gamenode']

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${DB_USER:?set in .env.production}
            - POSTGRES_PASSWORD=${DB_PASSWORD:?set in .env.production}
            - POSTGRES_DB=${DB_NAME:-archonarena}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./server/db/schema:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data

volumes:
    caddy_data:
    caddy_config:
    card_images:
    user_avatars:
    user_backgrounds:
    postgres_data:
    redis_data:
